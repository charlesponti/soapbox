server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. script-src includes 'wasm-unsafe-eval' so Pagefind's
    # WebAssembly worker can compile; Railway's built-in static server injects
    # a CSP without it, which broke search — hence the custom server.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    error_page 404 /404.html;

    # Hashed build assets: immutable, cache forever.
    location /_astro/ {
        expires max;
        try_files $uri =404;
    }

    # Pagefind runtime + search index: short TTL (changes every rebuild).
    location /pagefind/ {
        expires 1h;
        try_files $uri =404;
    }

    # HTML pages: always revalidate.
    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }
}